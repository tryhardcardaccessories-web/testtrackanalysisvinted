name: Vinted Tracker scheduled check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Explain scheduled connector status
        run: |
          echo "No live provider is configured yet."
          echo "Add an authorized provider connector before enabling automatic listing checks."
